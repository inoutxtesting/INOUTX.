
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | INOUTX</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #012f64, #004a9f, #012f64);
        }

        .reset-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .reset-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 38px 34px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
            border: 1px solid #e5e7eb;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-title {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #123b68;
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 13px;
            color: #6b7280;
        }

        .page-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .page-description {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
        }

        .form-control:focus {
            border-color: #123b68;
            box-shadow: 0 0 0 3px rgba(18, 59, 104, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        .password-toggle:hover {
            color: #123b68;
        }

        .password-hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }

        .reset-button {
            width: 100%;
            min-height: 48px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #123b68;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            transition: 0.2s ease;
        }

        .reset-button:hover {
            background: #0d2e52;
        }

        .reset-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .reset-message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.4;
        }

        .reset-message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        .reset-message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #123b68;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-wrapper {
                padding: 15px;
            }

            .reset-card {
                padding: 30px 22px;
            }

            .brand-title {
                font-size: 26px;
            }

            .page-title {
                font-size: 22px;
            }
        }
    </style>

</head>

<body>

    <div class="reset-wrapper">

        <div class="reset-card">

            <div class="brand">
                <h1 class="brand-title">
                    IN/OUT X
                </h1>

                <div class="brand-subtitle">
                    Vehicle Monitoring System
                </div>
            </div>

            <h2 class="page-title">
                Reset Password
            </h2>

            <p class="page-description">
                Create a new password for your INOUTX account.
            </p>

            <form id="resetForm">

                <div class="mb-3">

                    <label for="newPassword" class="form-label">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            class="form-control"
                            id="newPassword"
                            name="password"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleNewPassword"
                            aria-label="Show password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <div class="password-hint">
                        Password must contain at least 6 characters.
                    </div>

                </div>

                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Show password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="reset-button"
                    id="resetButton"
                >
                    Reset Password
                </button>

                <div
                    id="resetMessage"
                    class="reset-message"
                ></div>

            </form>

            <!-- FIXED: Go directly to login.html -->
            <a href="/login.html" class="back-login">
                ← Back to Login
            </a>

        </div>

    </div>

    <script>

        const API_BASE = "";

        // =========================================
        // GET RESET TOKEN
        // =========================================

        const urlParams =
            new URLSearchParams(window.location.search);

        const token =
            urlParams.get("token");


        // =========================================
        // GET ELEMENTS
        // =========================================

        const form =
            document.getElementById("resetForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const button =
            document.getElementById("resetButton");

        const message =
            document.getElementById("resetMessage");


        // =========================================
        // SHOW MESSAGE
        // =========================================

        function showMessage(text, type) {

            message.className =
                "reset-message " + type;

            message.textContent =
                text;
        }


        // =========================================
        // LOADING STATE
        // =========================================

        function setLoading(loading) {

            button.disabled = loading;

            if (loading) {

                button.innerHTML =
                    '<span class="spinner-border spinner-border-sm me-2"></span>' +
                    'Resetting...';

            } else {

                button.textContent =
                    "Reset Password";
            }
        }


        // =========================================
        // PASSWORD SHOW / HIDE
        // =========================================

        function setupPasswordToggle(input, toggleButton) {

            toggleButton.addEventListener(
                "click",
                function () {

                    const icon =
                        toggleButton.querySelector("i");

                    if (input.type === "password") {

                        input.type = "text";

                        icon.className =
                            "bi bi-eye-slash";

                        toggleButton.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        input.type = "password";

                        icon.className =
                            "bi bi-eye";

                        toggleButton.setAttribute(
                            "aria-label",
                            "Show password"
                        );
                    }
                }
            );
        }


        // =========================================
        // INITIALIZE PASSWORD TOGGLES
        // =========================================

        setupPasswordToggle(
            newPassword,
            document.getElementById("toggleNewPassword")
        );

        setupPasswordToggle(
            confirmPassword,
            document.getElementById("toggleConfirmPassword")
        );


        // =========================================
        // CHECK TOKEN
        // =========================================

        if (!token) {

            showMessage(
                "This password reset link is invalid or incomplete.",
                "error"
            );

            button.disabled = true;
        }


        // =========================================
        // SUBMIT RESET FORM
        // =========================================

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                if (!token) {
                    return;
                }

                const password =
                    newPassword.value;

                const confirmation =
                    confirmPassword.value;


                // =================================
                // VALIDATION
                // =================================

                if (password.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;
                }

                if (password !== confirmation) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                // =================================
                // LOADING
                // =================================

                setLoading(true);

                message.className =
                    "reset-message";

                message.textContent =
                    "";


                try {

                    // =================================
                    // SEND REQUEST
                    // =================================

                    const response =
                        await fetch(
                            API_BASE + "/api/reset-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        token: token,
                                        password: password,
                                        confirm_password: confirmation
                                    })
                            }
                        );


                    // =================================
                    // READ RESPONSE
                    // =================================

                    const result =
                        await response.json();


                    // =================================
                    // ERROR
                    // =================================

                    if (!response.ok) {

                        throw new Error(
                            result.error ||
                            "Unable to reset password."
                        );
                    }


                    // =================================
                    // SUCCESS
                    // =================================

                    showMessage(
                        result.message ||
                        "Password reset successfully.",
                        "success"
                    );

                    form.reset();


                    // =================================
                    // REDIRECT TO LOGIN
                    // =================================

                    setTimeout(
                        function () {

                            window.location.href =
                                "/login.html";

                        },
                        1800
                    );

                }

                catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to reset password.",
                        "error"
                    );

                    setLoading(false);
                }

            }
        );

    </script>

</body>

</html>
